name: Windows build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/flint/package-lock.json
      - name: Install desktop UI dependencies
        run: npm ci --prefix apps/flint
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Build directly from source
        run: cargo build --locked --release
      - name: Export Python Bridge
        run: target/release/flint.exe bridge export python --output target/release/flint-python.zip
      - name: Export C# Bridge
        run: target/release/flint.exe bridge export csharp --output target/release/flint-csharp.zip
      - name: Export Unity Bridge
        run: target/release/flint.exe bridge export unity --output target/release/flint-unity.tgz
      - name: Build environments stay under target
        shell: pwsh
        run: |
          foreach ($path in @('_local', '.venv', 'third_party')) {
            if (Test-Path -LiteralPath $path) { throw "Unexpected build input or output: $path" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flint-windows-x64
          path: |
            target/release/flint.exe
            target/release/flint-python.zip
            target/release/flint-csharp.zip
            target/release/flint-unity.tgz
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/flint/package-lock.json
      - name: Install desktop UI dependencies
        run: npm ci --prefix apps/flint
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: bridges/dotnet/global.json
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '24.4'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generated Rust protocol bindings are current
        run: cargo codegen --check
      - name: Tests
        run: cargo xtask test
