[package]
name = "flint"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
flint-core.workspace = true
flint-control-client.workspace = true
flint-connect.workspace = true
flint-protocol.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-decoration.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
serde_json.workspace = true
clap = { workspace = true, features = ["derive"] }
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }
base64 = "0.22"
png = "0.17"

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
wait-timeout.workspace = true

[[test]]
name = "product"
path = "../../../tests/main.rs"
