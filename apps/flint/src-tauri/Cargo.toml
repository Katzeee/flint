[package]
name = "flint"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
test-runtime = ["flint-backend/test-runtime"]

[dependencies]
thiserror.workspace = true
flint-backend.workspace = true
flint-hosts.workspace = true
flint-contracts = { workspace = true, features = ["protocol"] }
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-decoration.workspace = true
tauri-plugin-single-instance.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
futures-util = { workspace = true, features = ["sink"] }
fs2.workspace = true
uuid = { workspace = true, features = ["v4"] }
strum.workspace = true
clap = { workspace = true, features = ["derive"] }
anyhow.workspace = true
base64 = "0.22"

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
wait-timeout.workspace = true

[[test]]
name = "product"
path = "../../../tests/main.rs"
required-features = ["test-runtime"]
