[package]
name = "flint"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"
default-run = "flint"

[features]
default = ["desktop", "custom-protocol"]
desktop = []
bindings = ["dep:specta-typescript"]
custom-protocol = ["tauri/custom-protocol"]
test-runtime = ["flint-backend/test-runtime"]

[dependencies]
thiserror.workspace = true
flint-backend.workspace = true
flint-hosts = { workspace = true, features = ["typescript"] }
flint-contracts = { workspace = true, features = ["protocol", "typescript"] }
specta.workspace = true
specta-typescript = { workspace = true, optional = true }
tauri-specta.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-decoration.workspace = true
tauri-plugin-single-instance.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
futures-util = { workspace = true, features = ["sink"] }
uuid = { workspace = true, features = ["v4"] }
strum.workspace = true
clap = { workspace = true, features = ["derive"] }
anyhow.workspace = true
base64 = "0.22"

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
wait-timeout.workspace = true

[[bin]]
name = "flint"
path = "src/main.rs"
required-features = ["desktop"]

[[test]]
name = "product"
path = "../../../tests/main.rs"
required-features = ["test-runtime"]

[[bin]]
name = "flint-bindings"
path = "src/bindings.rs"
required-features = ["bindings"]

[lints]
workspace = true
