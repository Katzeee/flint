[workspace]
members = ["crates/flint-contracts", "crates/flint-backend", "crates/flint-hosts", "crates/flint-bridge-core", "crates/flint-bridge-bootstrap", "apps/flint/src-tauri", "tools/contracts-codegen", "tools/xtask"]
default-members = ["apps/flint/src-tauri"]
resolver = "2"

[workspace.metadata.tools.prek]
version = "0.4.8"

[workspace.metadata.tools.protoc]
version = "24.4"

[workspace.metadata.tools.protoc.sha256]
win64 = "8f3f92fbf7dd2995129e6fe223c07c0aaa97fb182f19cecfb424e9146b273eb6"
linux-x86_64 = "5871398dfd6ac954a6adebf41f1ae3a4de915a36a6ab2fd3e8f2c00d45b50dec"
linux-aarch_64 = "83ac000ff540e242b6a2ff221a3ac88d2d8e55443801b7a28e9697e5f40e8937"
osx-universal_binary = "db05abb05879b66bd1a8388dc8464e3980f69dd2065c9371024f2feccdae8eee"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
flint-contracts = { path = "crates/flint-contracts", default-features = false }
flint-backend = { path = "crates/flint-backend" }
flint-hosts = { path = "crates/flint-hosts" }

anyhow = "1"
thiserror = "2"
bytes = "1"
chrono = "0.4"
clap = "4"
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
prost = "=0.13.5"
prost-build = "=0.13.5"
serde = "1"
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
serde_with = { version = "3", default-features = false, features = ["macros", "std"] }
strum = "0.28"
sysinfo = { version = "0.33", default-features = false }
tauri = "2"
tauri-build = "2"
tauri-plugin-decoration = "3.0.5"
tauri-plugin-single-instance = "2"
tempfile = "3"
tokio = "1"
tokio-util = "0.7"
uuid = "1"
wait-timeout = "0.2"

[profile.release]
lto = "thin"
strip = true
