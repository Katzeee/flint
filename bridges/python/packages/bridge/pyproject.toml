[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flint-bridge"
version = "0.1.0"
description = "Host-side Python bridge for flint"
requires-python = ">=3.7"
dependencies = ["flint-protocol==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
