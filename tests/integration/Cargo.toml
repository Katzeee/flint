[package]
name = "flint-integration-tests"
version.workspace = true
edition.workspace = true
publish = false

[dev-dependencies]
anyhow = "1"
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"
flint-protocol = { path = "../../crates/flint-protocol" }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
