syntax = "proto3";
package flint_protocol.v1;
import "flint_protocol/v1/common.proto";

// Opens the registration/heartbeat connection; execution uses a separate connection.
message RegisterInstance {
  uint32 pid = 1;
  string instance_name = 2;
  string instance_type = 3;
  // Host-generated 16-character Base64URL identity of one process lifetime.
  // Stable across Bridge recreation, reconnects, and backend changes.
  string instance_id = 4;
  string runtime_version = 5;
  string bridge_version = 6;
}
// Joins the session established on the registration/heartbeat connection.
message RegisterExecutionChannel { string session_id = 1; }
message Heartbeat {}
message SessionRegistered { string session_id = 1; }
// Confirms execution-channel registration or a heartbeat.
message Ack {}
message HostExecuteRequest {
  string execution_id = 1;
  string code = 2;
  string workflow_id = 3;
  optional string execution_name = 4;
  optional string filename = 5;
}
message ExecutionOutputUpdate {
  string execution_id = 1;
  string workflow_id = 2;
  // Starts at 1 per execution. Repeated sequences are ignored; a gap closes the connection.
  uint64 sequence = 3;
  string stdout_delta = 4;
  string stderr_delta = 5;
}
