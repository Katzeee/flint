syntax = "proto3";
package flint_protocol.v1;
import "flint_protocol/v1/common.proto";
import "flint_protocol/v1/control.proto";
import "flint_protocol/v1/host.proto";

// Each frame carries one envelope. Responses and output updates echo request_id.
// Any request may be answered with a Failure payload instead of its response.
message Envelope {
  uint32 protocol_version = 1;
  string request_id = 2;
  oneof payload {
    PingRequest ping_request = 3;
    PingResponse ping_response = 4;
    StopBackendRequest stop_backend_request = 5;
    StopBackendResponse stop_backend_response = 6;
    ListInstancesRequest list_instances_request = 7;
    ListInstancesResponse list_instances_response = 8;
    StartWorkflowRequest start_workflow_request = 9;
    StartWorkflowResponse start_workflow_response = 10;
    ExecuteRequest execute_request = 11;
    GetExecutionRequest get_execution_request = 12;
    GetExecutionResponse get_execution_response = 13;
    Failure failure = 14;
    ListWorkflowsRequest list_workflows_request = 15;
    ListWorkflowsResponse list_workflows_response = 16;
    GetWorkflowRequest get_workflow_request = 17;
    GetWorkflowResponse get_workflow_response = 18;
    RegisterInstance register_instance = 19;
    RegisterExecutionChannel register_execution_channel = 20;
    Heartbeat heartbeat = 21;
    SessionRegistered session_registered = 22;
    Ack ack = 23;
    HostExecuteRequest host_execute_request = 24;
    ExecutionOutputUpdate execution_output_update = 25;
    ExecutionResult execution_result = 26;
  }
}
