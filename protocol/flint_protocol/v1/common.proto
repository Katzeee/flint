syntax = "proto3";
package flint_protocol.v1;
option csharp_namespace = "Flint.Protocol.V1";

enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_PENDING = 1;
  EXECUTION_STATUS_RUNNING = 2;
  EXECUTION_STATUS_SUCCEEDED = 3;
  EXECUTION_STATUS_FAILED = 4;
}

// Protocol and execution failures share stable identifiers across callers.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PROTOCOL_ERROR = 1;
  ERROR_CODE_INTERNAL_ERROR = 2;
  ERROR_CODE_UNKNOWN_CLIENT = 3;
  ERROR_CODE_UNKNOWN_REQUEST = 4;
  ERROR_CODE_WORKFLOW_NOT_FOUND = 5;
  ERROR_CODE_EXECUTION_NOT_FOUND = 6;
  ERROR_CODE_INSTANCE_OFFLINE = 7;
  ERROR_CODE_BACKEND_BUSY = 8;
  ERROR_CODE_BACKEND_STOPPING = 9;
  ERROR_CODE_BACKEND_CHANGED = 10;
  ERROR_CODE_ALREADY_REGISTERED = 11;
  ERROR_CODE_NOT_REGISTERED = 12;
  ERROR_CODE_UNEXPECTED_MESSAGE_TYPE = 13;
  ERROR_CODE_INSTANCE_BUSY = 14;
  ERROR_CODE_CONNECTION_FAILED = 15;
  ERROR_CODE_EXECUTION_TIMEOUT = 16;
}

message ProtocolError {
  ErrorCode code = 1;
  string message = 2;
}

message InstanceInfo {
  string instance_id = 1;
  string instance_name = 2;
  string instance_type = 3;
  uint32 pid = 4;
  string runtime_version = 5;
  string bridge_version = 6;
  // The execution connection is established; this does not mean the instance is idle.
  bool execution_ready = 7;
}

// A running response is an early return; terminal results retain this execution ID.
message ExecutionResult {
  string execution_id = 1;
  ExecutionStatus status = 2;
  optional string traceback = 3;
  // Host failures may contain arbitrary exception text, as well as known codes.
  optional string error = 4;
}
