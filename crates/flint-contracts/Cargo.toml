[package]
name = "flint-contracts"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-runtime = []
default = ["protocol"]
protocol = ["dep:bytes", "dep:prost", "dep:tokio-util", "dep:tokio", "dep:futures-util", "dep:serde_with"]
typescript = ["dep:specta"]

[dependencies]
sha2 = "0.10"
base64 = "0.22"
machine-uid = "0.5"
anyhow.workspace = true
dirs.workspace = true
fs2.workspace = true
serde = { workspace = true, features = ["derive"] }
specta = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
strum = { workspace = true, features = ["derive"] }
bytes = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["codec"], optional = true }
tokio = { workspace = true, features = ["io-util", "time"], optional = true }
futures-util = { workspace = true, features = ["sink"], optional = true }

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
