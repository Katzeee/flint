[package]
name = "flint-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
prost = "=0.13.5"
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
futures-util = { version = "0.3", features = ["sink"] }
